<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQLab - Online SQL Exam Platform</title>
    <link rel="stylesheet" href="css/style.css?v=20260328-4">
</head>
<body class="login-bg">
    <div class="login-shell">
        <section class="login-hero" aria-hidden="true">
            <p class="hero-kicker">SQLAB PORTAL</p>
            <h1 class="hero-title">Attempt smart,<br><span>query wisely</span></h1>
            <p class="hero-copy">A minimal SQL examination workspace with timed sessions, auto-save, and offline reliability.</p>
        </section>

        <div class="login-container">
            <div class="login-card">
                <h1>SQLab</h1>
                <p class="subtitle">Online SQL Exam Platform</p>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label for="studentName">Reg_Name</label>
                        <input type="text" id="studentName" required placeholder="Enter your full name">
                    </div>
                    
                    <div class="form-group">
                        <label for="examPassword">Exam Password</label>
                        <input type="password" id="examPassword" required placeholder="Enter exam password">
                    </div>

                    <div id="loginError" class="error-msg" style="display: none;"></div>
                    
                    <button type="submit" class="btn btn-primary btn-block">Enter Exam</button>
                </form>
                
                <div class="info-msg">
                    <i class="icon-info"></i> Internet connection is not required during the exam.
                </div>
                
                <div class="admin-link">
                    <a href="admin.html">Examiner Login</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">

        import { verifyExamPassword } from './js/db.js';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const studentName = document.getElementById('studentName').value.trim();
            const examPassword = document.getElementById('examPassword').value.trim();
            const errorEl = document.getElementById('loginError');
            
            try {

                
                const exam = await verifyExamPassword(examPassword);
                if (exam) {
                    const studentLockKey = String(studentName || '').trim().toLowerCase();
                    const lockKey = `sqlab_exam_locked_${exam.id}_${studentLockKey}`;
                    if (localStorage.getItem(lockKey)) {
                        errorEl.textContent = 'You have already ended this exam. Re-entry is blocked.';
                        errorEl.style.display = 'block';
                        return;
                    }

                    const normalizedQuestions = Array.isArray(exam.questions)
                        ? exam.questions
                            .map(q => String(q ?? '').trim())
                            .filter(q => q.length > 0)
                        : [];
                    const durationMinutes = parseInt(exam.durationMinutes, 10) || 60;

                    sessionStorage.setItem('sqlab_studentName', studentName);
                    sessionStorage.setItem('sqlab_examId', exam.id);
                    sessionStorage.setItem('sqlab_examTitle', exam.title);
                    sessionStorage.setItem('sqlab_examDuration', String(durationMinutes));
                    sessionStorage.setItem('sqlab_examQuestions', JSON.stringify(normalizedQuestions));
                    sessionStorage.removeItem('sqlab_examStartTime');

                    localStorage.setItem(`sqlab_exam_payload_${exam.id}`, JSON.stringify({
                        id: exam.id,
                        title: exam.title,
                        durationMinutes,
                        questions: normalizedQuestions,
                        cachedAt: Date.now()
                    }));

                    localStorage.setItem('sqlab_exam_recovery_state', JSON.stringify({
                        examId: exam.id,
                        studentName,
                        examTitle: exam.title,
                        examDuration: durationMinutes,
                        examStartTime: null,
                        currentQuestionIndex: 0,
                        pendingSubmission: false,
                        updatedAt: Date.now()
                    }));

                    window.location.href = 'exam.html';
                } else {
                    errorEl.textContent = 'Invalid exam password';
                    errorEl.style.display = 'block';
                }
            } catch (err) {
                errorEl.textContent = 'Error connecting to database. Please check your connection.';
                errorEl.style.display = 'block';
                console.error(err);
            }
        });

        // Register Service Worker for offline support
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js?v=20260328-8')
                .then(reg => {
                    reg.update();
                    console.log('SW registered', reg);
                })
                .catch(err => console.error('SW register failed', err));
        }
    </script>

    <footer class="site-footer">
        Made by Sijomon P S MCA-202-27
    </footer>
</body>
</html>
