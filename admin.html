<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQLab - Examiner Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="admin-bg">
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-brand">SQLab Examiner</div>
        <div class="nav-links">
            <span id="adminName" style="margin-right:15px;">Loading...</span>
            <button id="changePwdBtn" class="btn btn-primary btn-sm" style="display:none; margin-right:10px;">Change Password</button>
            <button id="logoutBtn" class="btn btn-outline btn-sm" style="display:none;">Logout</button>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Auth View -->
        <div id="authView" class="auth-section">
            <div class="login-card mx-auto">
                <h2 style="margin-bottom: 20px;">Examiner Login</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <input type="email" id="loginEmail" class="form-control" placeholder="Email Address" required>
                    </div>
                    <div class="form-group">
                        <input type="password" id="loginPwd" class="form-control" placeholder="Password" required>
                    </div>
                    <div id="loginError" class="error-msg" style="display:none;"></div>
                    <button type="submit" id="loginBtn" class="btn btn-primary btn-block">Login</button>
                </form>
            </div>
        </div>

        <!-- Dashboard View (hidden till auth) -->
        <div id="dashboardView" style="display: none;">
            <ul class="nav-tabs">
                <li class="tab-item active" data-target="manageTab">Manage Exams</li>
                <li class="tab-item" data-target="reviewTab">Review Submissions</li>
            </ul>

            <!-- Manage Exams Tab -->
            <div id="manageTab" class="tab-content active">
                <div class="card p-4 mb-4">
                    <h3>Create New Exam</h3>
                    <form id="createExamForm">
                        <div class="form-group">
                            <label>Exam Title</label>
                            <input type="text" id="newExamTitle" required class="form-control">
                        </div>
                        <div class="form-group">
                            <label>Exam Password (for students to enter)</label>
                            <input type="text" id="newExamPassword" required class="form-control">
                        </div>
                        <div class="form-group">
                            <label>Duration (minutes)</label>
                            <input type="number" id="newExamDuration" required class="form-control" value="60" min="1">
                        </div>
                        
                        <h4>Questions</h4>
                        <div id="questionsContainer">
                            <div class="form-group question-row">
                                <label>Q1</label>
                                <textarea class="form-control q-input" rows="3" required></textarea>
                            </div>
                        </div>
                        <button type="button" id="addQuestionBtn" class="btn btn-secondary btn-sm mb-3">+ Add Another Question</button>
                        <br>
                        <button type="submit" class="btn btn-primary">Save Exam</button>
                    </form>
                </div>
                
                <h4>Created Exams</h4>
                <div id="examsList" class="exam-list">
                    <!-- Loaded dynamically -->
                </div>
            </div>

            <!-- Review Submissions Tab -->
            <div id="reviewTab" class="tab-content">
                <div class="form-group">
                    <label>Select Exam</label>
                    <select id="examSelect" class="form-control">
                        <option value="">-- Change later dynamically --</option>
                    </select>
                </div>
                
                <div id="submissionsListContainer" class="mt-4">
                    <p class="text-muted">Select an exam to view submissions.</p>
                </div>

                <div id="studentDetailContainer" class="mt-4" style="display: none;">
                    <button id="backToSubmissionsBtn" class="btn btn-secondary mb-3">&larr; Back to Students List</button>
                    <div id="studentDetailContent"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Password Change Modal -->
    <div id="pwdModal" class="submit-overlay" style="display: none;">
        <div class="submit-card text-left" style="min-width: 300px;">
            <h2 style="margin-bottom: 20px;">Change Password</h2>
            <form id="pwdForm">
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="newPwd" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPwd" class="form-control" required>
                </div>
                <div id="pwdError" class="error-msg" style="display:none;"></div>
                <div id="pwdSuccess" style="color:var(--success); font-weight:bold; margin-bottom:15px; display:none;">Password updated successfully!</div>
                <button type="submit" id="updatePwdBtn" class="btn btn-primary">Update Password</button>
                <button type="button" id="closePwdModal" class="btn btn-secondary" style="margin-left: 10px;">Cancel</button>
            </form>
        </div>
    </div>

    <!-- Edit Exam Modal -->
    <div id="editExamModal" class="submit-overlay" style="display: none;">
        <div class="submit-card text-left" style="min-width: 600px; max-height: 90vh; overflow-y: auto;">
            <h2 style="margin-bottom: 20px;">Edit Exam</h2>
            <form id="editExamForm">
                <div class="form-group">
                    <label>Exam Title</label>
                    <input type="text" id="editExamTitle" required class="form-control">
                </div>
                <div class="form-group">
                    <label>Exam Password</label>
                    <input type="text" id="editExamPassword" required class="form-control">
                </div>
                <div class="form-group">
                    <label>Duration (minutes)</label>
                    <input type="number" id="editExamDuration" required class="form-control" min="1">
                </div>
                
                <h4>Questions</h4>
                <div id="editQuestionsContainer" style="margin-bottom: 15px;">
                    <!-- Questions will be populated here -->
                </div>
                <button type="button" id="editAddQuestionBtn" class="btn btn-secondary btn-sm mb-3">+ Add Question</button>
                
                <div id="editExamError" class="error-msg" style="display:none;"></div>
                <div id="editExamSuccess" style="color:var(--success); font-weight:bold; margin-bottom:15px; display:none;">Exam updated successfully!</div>
                
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <button type="button" id="closeEditModal" class="btn btn-secondary" style="margin-left: 10px;">Cancel</button>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module">

        import { signInEmail, signOutAdmin, authStateObserver, updateAdminPassword } from './js/auth.js';
        import { createExam, getExamsList, getSubmissionsForExam, saveMarks, getExamQuestions, updateExam, updateExamQuestions, getFullExamDetails, deleteExam } from './js/db.js';
        import { createReadOnlyEditor } from './js/editor.js';

        let currentAdmin = null;
        let exams = [];
        let selectedExamQuestions = [];
        let currentSubmissions = [];
        let currentlySelectedStudent = null;
        let editorInstances = [];
        let currentExamId = null;
        let currentEditingExamId = null;
        let editQuestionsCount = 1;

        const init = async () => {
            try {

                authStateObserver(user => {
                    if (user) {
                        currentAdmin = user;
                        document.getElementById('adminName').textContent = user.displayName || user.email;
                        document.getElementById('logoutBtn').style.display = 'inline-block';
                        document.getElementById('changePwdBtn').style.display = 'inline-block';
                        document.getElementById('authView').style.display = 'none';
                        document.getElementById('dashboardView').style.display = 'block';
                        loadExams();
                    } else {
                        currentAdmin = null;
                        document.getElementById('adminName').textContent = '';
                        document.getElementById('logoutBtn').style.display = 'none';
                        document.getElementById('changePwdBtn').style.display = 'none';
                        document.getElementById('authView').style.display = 'block';
                        document.getElementById('dashboardView').style.display = 'none';
                    }
                });
            } catch (err) {
                console.error("Firebase init failed:", err);
            }
        };

        // UI Event Listeners
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const pwd = document.getElementById('loginPwd').value;
            const errorEl = document.getElementById('loginError');
            const btn = document.getElementById('loginBtn');
            errorEl.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'Logging in...';
            try { 
                await signInEmail(email, pwd); 
            } catch (err) { 
                errorEl.textContent = 'Invalid email or password';
                errorEl.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Login';
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            signOutAdmin();
        });

        // Password Change logic
        document.getElementById('changePwdBtn').addEventListener('click', () => {
            document.getElementById('pwdForm').reset();
            document.getElementById('pwdError').style.display = 'none';
            document.getElementById('pwdSuccess').style.display = 'none';
            document.getElementById('pwdModal').style.display = 'flex';
        });

        document.getElementById('closePwdModal').addEventListener('click', () => {
            document.getElementById('pwdModal').style.display = 'none';
        });

        document.getElementById('pwdForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPwd = document.getElementById('newPwd').value;
            const confirmPwd = document.getElementById('confirmPwd').value;
            const errorEl = document.getElementById('pwdError');
            const successEl = document.getElementById('pwdSuccess');
            const btn = document.getElementById('updatePwdBtn');
            
            errorEl.style.display = 'none';
            successEl.style.display = 'none';
            
            if (newPwd !== confirmPwd) {
                errorEl.textContent = 'Passwords do not match.';
                errorEl.style.display = 'block';
                return;
            }
            if (newPwd.length < 6) {
                errorEl.textContent = 'Password must be at least 6 characters.';
                errorEl.style.display = 'block';
                return;
            }
            
            try {
                btn.disabled = true;
                btn.textContent = 'Updating...';
                await updateAdminPassword(newPwd);
                successEl.style.display = 'block';
                setTimeout(() => {
                    document.getElementById('pwdModal').style.display = 'none';
                }, 2000);
            } catch (err) {
                console.error(err);
                if (err.code === 'auth/requires-recent-login') {
                    errorEl.textContent = 'Updating password requires a recent login. Please log out and sign back in to change your password.';
                } else {
                    errorEl.textContent = 'Failed to update password: ' + err.message;
                }
                errorEl.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Update Password';
            }
        });

        // Edit Exam Modal Handlers
        const openEditExamModal = async (exam) => {
            currentEditingExamId = exam.id;
            editQuestionsCount = 0;
            
            document.getElementById('editExamTitle').value = exam.title;
            document.getElementById('editExamPassword').value = exam.password;
            document.getElementById('editExamDuration').value = exam.durationMinutes || 60;
            
            const qContainer = document.getElementById('editQuestionsContainer');
            qContainer.innerHTML = '';
            
            const questions = exam.questions || [];
            questions.forEach((q, idx) => {
                editQuestionsCount++;
                const div = document.createElement('div');
                div.className = 'form-group edit-question-row';
                div.innerHTML = `
                    <div style="display: flex; gap: 10px; align-items: flex-start;">
                        <div style="flex: 1;">
                            <label>Q${idx + 1}</label>
                            <textarea class="form-control edit-q-input" rows="3" required>${q}</textarea>
                        </div>
                        <button type="button" class="btn btn-danger btn-sm delete-q-btn" data-index="${idx}" style="height: fit-content; margin-top: 27px;">Delete</button>
                    </div>
                `;
                qContainer.appendChild(div);
            });
            
            document.getElementById('editExamError').style.display = 'none';
            document.getElementById('editExamSuccess').style.display = 'none';
            document.getElementById('editExamModal').style.display = 'flex';
            
            // Add delete button listeners
            document.querySelectorAll('.delete-q-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    btn.closest('.edit-question-row').remove();
                });
            });
        };

        document.getElementById('editAddQuestionBtn').addEventListener('click', (e) => {
            e.preventDefault();
            editQuestionsCount++;
            const div = document.createElement('div');
            div.className = 'form-group edit-question-row';
            div.innerHTML = `
                <div style="display: flex; gap: 10px; align-items: flex-start;">
                    <div style="flex: 1;">
                        <label>Q${editQuestionsCount}</label>
                        <textarea class="form-control edit-q-input" rows="3" required></textarea>
                    </div>
                    <button type="button" class="btn btn-danger btn-sm delete-q-btn" style="height: fit-content; margin-top: 27px;">Delete</button>
                </div>
            `;
            document.getElementById('editQuestionsContainer').appendChild(div);
            
            div.querySelector('.delete-q-btn').addEventListener('click', (e) => {
                e.preventDefault();
                div.remove();
            });
        });

        document.getElementById('closeEditModal').addEventListener('click', () => {
            document.getElementById('editExamModal').style.display = 'none';
        });

        document.getElementById('editExamForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('editExamTitle').value;
            const password = document.getElementById('editExamPassword').value;
            const duration = document.getElementById('editExamDuration').value;
            const qInputs = document.querySelectorAll('.edit-q-input');
            const questions = Array.from(qInputs).map(i => i.value.trim()).filter(q => q.length > 0);
            
            const errorEl = document.getElementById('editExamError');
            const successEl = document.getElementById('editExamSuccess');
            errorEl.style.display = 'none';
            successEl.style.display = 'none';
            
            if (questions.length === 0) {
                errorEl.textContent = 'Please add at least one question.';
                errorEl.style.display = 'block';
                return;
            }
            
            try {
                const btn = e.target.querySelector('button[type="submit"]');
                btn.disabled = true;
                btn.textContent = 'Saving...';
                
                await updateExam(currentEditingExamId, {
                    title,
                    password,
                    durationMinutes: parseInt(duration)
                });
                
                await updateExamQuestions(currentEditingExamId, questions);
                
                successEl.style.display = 'block';
                setTimeout(() => {
                    document.getElementById('editExamModal').style.display = 'none';
                    loadExams();
                }, 1500);
            } catch (err) {
                errorEl.textContent = 'Error updating exam: ' + err.message;
                errorEl.style.display = 'block';
                e.target.querySelector('button[type="submit"]').disabled = false;
                e.target.querySelector('button[type="submit"]').textContent = 'Save Changes';
            }
        });

        const handleDeleteExam = async (examId) => {
            try {
                await deleteExam(examId);
                loadExams();
            } catch (err) {
                alert('Error deleting exam: ' + err.message);
            }
        };

        // Tabs
        document.querySelectorAll('.tab-item').forEach(tab => {
            tab.addEventListener('click', (e) => {
                document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                
                e.target.classList.add('active');
                const targetId = e.target.getAttribute('data-target');
                document.getElementById(targetId).classList.add('active');
                
                if (targetId === 'reviewTab') {
                    populateExamSelect();
                }
            });
        });

        // Add question field
        let qCount = 1;
        document.getElementById('addQuestionBtn').addEventListener('click', () => {
            qCount++;
            const div = document.createElement('div');
            div.className = 'form-group question-row';
            div.innerHTML = `
                <label>Q${qCount}</label>
                <textarea class="form-control q-input" rows="3" required></textarea>
            `;
            document.getElementById('questionsContainer').appendChild(div);
        });

        // Create exam form
        document.getElementById('createExamForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('newExamTitle').value;
            const pwd = document.getElementById('newExamPassword').value;
            const duration = document.getElementById('newExamDuration').value;
            const qInputs = document.querySelectorAll('.q-input');
            const questions = Array.from(qInputs).map(i => i.value.trim()).filter(q => q.length > 0);
            
            try {
                const btn = e.target.querySelector('button[type="submit"]');
                btn.disabled = true;
                btn.textContent = 'Saving...';
                
                await createExam(title, pwd, questions, duration);
                
                alert("Exam created successfully!");
                e.target.reset();
                document.getElementById('newExamDuration').value = '60';
                // clear extra questions
                document.getElementById('questionsContainer').innerHTML = `
                    <div class="form-group question-row">
                        <label>Q1</label>
                        <textarea class="form-control q-input" rows="3" required></textarea>
                    </div>`;
                qCount = 1;
                loadExams();
                btn.disabled = false;
                btn.textContent = 'Save Exam';
            } catch (err) {
                alert("Error creating exam: " + err.message);
                e.target.querySelector('button[type="submit"]').disabled = false;
                e.target.querySelector('button[type="submit"]').textContent = 'Save Exam';
            }
        });

        const loadExams = async () => {
            exams = await getExamsList();
            const listDiv = document.getElementById('examsList');
            if (exams.length === 0) {
                listDiv.innerHTML = '<p class="text-muted">No exams created yet.</p>';
                return;
            }
            
            let html = '';
            exams.forEach(ex => {
                // Formatting creation date roughly
                let dStr = 'Unknown date';
                if(ex.createdAt) {
                    const d = ex.createdAt.toDate ? ex.createdAt.toDate() : new Date();
                    dStr = d.toLocaleString();
                }
                const duration = ex.durationMinutes || 60;
                
                html += `
                <div class="card p-4 mb-3" style="background:var(--bg-main)">
                    <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 10px;">
                        <div>
                            <h5 style="margin-bottom:10px">${ex.title}</h5>
                            <p style="margin:5px 0"><strong>Password:</strong> <span style="color:var(--kw-color)">${ex.password}</span></p>
                            <p style="margin:5px 0"><strong>Duration:</strong> ${duration} minutes</p>
                            <p style="margin:5px 0; font-size:0.9rem">Questions: ${ex.questions ? ex.questions.length : 0}</p>
                            <p style="margin:5px 0; font-size:0.8rem" class="text-muted">Created: ${dStr}</p>
                        </div>
                        <div>
                            <button class="btn btn-info btn-sm edit-exam-btn" data-exam-id="${ex.id}" style="margin-bottom: 5px; width: 80px;">Edit</button>
                            <button class="btn btn-danger btn-sm delete-exam-btn" data-exam-id="${ex.id}" style="width: 80px;">Delete</button>
                        </div>
                    </div>
                </div>
                `;
            });
            listDiv.innerHTML = html;
            
            // Attach event listeners
            document.querySelectorAll('.edit-exam-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const examId = e.target.getAttribute('data-exam-id');
                    const exam = exams.find(ex => ex.id === examId);
                    openEditExamModal(exam);
                });
            });
            
            document.querySelectorAll('.delete-exam-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const examId = e.target.getAttribute('data-exam-id');
                    if (confirm('Are you sure you want to delete this exam?')) {
                        handleDeleteExam(examId);
                    }
                });
            });
        };

        const populateExamSelect = async () => {
            if (!currentAdmin) return;
            console.log("[Review] Fetching all exams for dropdown...");
            const select = document.getElementById('examSelect');
            select.innerHTML = '<option value="">Loading exams...</option>';
            
            try {
                exams = await getExamsList();
                console.log(`[Review] Fetched ${exams.length} exams for dropdown.`);
                let html = '<option value="">-- Select an Exam --</option>';
                exams.forEach(ex => {
                    html += `<option value="${ex.id}">${ex.title}</option>`;
                });
                select.innerHTML = html;
                
                const listContainer = document.getElementById('submissionsListContainer');
                if(listContainer) {
                    listContainer.style.display = 'block';
                    listContainer.innerHTML = '<p class="text-muted">Select an exam to view submissions.</p>';
                }
                const detailContainer = document.getElementById('studentDetailContainer');
                if (detailContainer) detailContainer.style.display = 'none';
            } catch (err) {
                console.error("[Review] Error loading exams list:", err);
                select.innerHTML = '<option value="">Error loading exams</option>';
            }
        };

        const renderSubmissionsList = () => {
            const listContainer = document.getElementById('submissionsListContainer');
            listContainer.innerHTML = '';
            
            if (currentSubmissions.length === 0) {
                listContainer.innerHTML = '<p class="text-muted">No submissions yet for this exam.</p>';
                return;
            }
            
            currentSubmissions.forEach((sub, subIdx) => {
                const status = sub.submittedAt ? "Completed" : "In Progress";
                
                // Calculate cumulative marks
                let marksDisplay = `<span style="color:var(--text-muted)">Not Graded</span>`;
                if (sub.marks && Array.isArray(sub.marks) && sub.marks.some(m => m !== null && m !== undefined)) {
                    let total = 0;
                    sub.marks.forEach(m => {
                        if (typeof m === 'number') total += m;
                    });
                    marksDisplay = `Total Marks: <strong style="color:var(--success)">${total}</strong>`;
                }
                
                const card = document.createElement('div');
                card.className = 'card p-3 mb-3 d-flex';
                card.style.justifyContent = 'space-between';
                card.style.alignItems = 'center';
                
                card.innerHTML = `
                    <div>
                        <h5 style="margin-bottom: 5px;">${sub.studentName}</h5>
                        <p class="text-muted" style="margin-bottom: 5px; font-size: 0.85rem;">Status: ${status}</p>
                        <p style="margin: 0; font-size: 0.95rem;">${marksDisplay}</p>
                    </div>
                    <button class="btn btn-primary btn-sm view-student-btn" data-index="${subIdx}">View Answers</button>
                `;
                listContainer.appendChild(card);
                
                card.querySelector('.view-student-btn').addEventListener('click', () => {
                    showStudentDetail(subIdx, currentExamId);
                });
            });
        };

        document.getElementById('backToSubmissionsBtn').addEventListener('click', () => {
            document.getElementById('studentDetailContainer').style.display = 'none';
            document.getElementById('submissionsListContainer').style.display = 'block';
            // Re-render list to show updated totals if marks were saved
            renderSubmissionsList();
        });

        document.getElementById('examSelect').addEventListener('change', async (e) => {
            currentExamId = e.target.value;
            const listContainer = document.getElementById('submissionsListContainer');
            const detailContainer = document.getElementById('studentDetailContainer');
            
            detailContainer.style.display = 'none';
            listContainer.style.display = 'block';
            
            if (!currentExamId) {
                listContainer.innerHTML = '<p class="text-muted">Select an exam to view submissions.</p>';
                return;
            }
            
            listContainer.innerHTML = '<p class="text-muted">Loading submissions...</p>';
            console.log(`[Review] UI Trigger: Exam selected. examId = ${currentExamId}`);
            
            try {
                selectedExamQuestions = await getExamQuestions(currentExamId);
                console.log(`[Review] Detected ${selectedExamQuestions.length} questions for exam ${currentExamId}`);
                
                currentSubmissions = await getSubmissionsForExam(currentExamId);
                console.log(`[Review] Found ${currentSubmissions.length} student submissions`);
                
                renderSubmissionsList();
                
            } catch (err) {
                console.error("[Review] Error fetching submissions:", err);
                listContainer.innerHTML = '<p style="color:red">Failed to load: ' + err.message + '</p>';
            }
        });

        const showStudentDetail = (subIdx, examId) => {
            document.getElementById('submissionsListContainer').style.display = 'none';
            const detailContainer = document.getElementById('studentDetailContainer');
            const content = document.getElementById('studentDetailContent');
            detailContainer.style.display = 'block';
            content.innerHTML = '';
            editorInstances = []; // Reset editors
            
            const sub = currentSubmissions[subIdx];
            console.log(`[Review] Displaying detail page for: ${sub.studentName}`);
            
            const status = sub.submittedAt ? "Completed" : "In Progress";
            
            const headerHtml = `
                <h3 style="margin-bottom: 5px;">Student: ${sub.studentName}</h3>
                <p class="text-muted" style="margin-bottom: 20px;">Status: ${status}</p>
                <div class="answers-list" id="detail-answers-list"></div>
                <button id="detailSaveMarksBtn" class="btn btn-primary mt-3">Save Marks</button>
                <div id="detailSaveResult" class="mt-2" style="color:var(--success); display:none;">Marks saved!</div>
            `;
            content.innerHTML = headerHtml;
            
            const answersList = content.querySelector('#detail-answers-list');
            const marksArr = sub.marks || [];
            
            selectedExamQuestions.forEach((q, qIndex) => {
                const answerText = (sub.answers && sub.answers[qIndex]) ? sub.answers[qIndex] : '-- No answer submitted --';
                const mark = marksArr[qIndex] !== undefined && marksArr[qIndex] !== null ? marksArr[qIndex] : '';
                
                const block = document.createElement('div');
                block.className = 'card p-4 mb-3';
                block.style.background = 'var(--bg-main)';
                
                const editorId = `cm-viewer-detail-${subIdx}-${qIndex}`;
                
                block.innerHTML = `
                    <div style="margin-bottom:15px">
                        <strong>Q${qIndex + 1}:</strong> ${q}
                    </div>
                    <div id="${editorId}" style="height:150px; border:1px solid var(--border); margin-bottom:10px;"></div>
                    <div class="d-flex" style="align-items:center;">
                        <label style="margin-right:10px; font-weight:bold;">Marks:</label>
                        <input type="number" class="form-control detail-mark-input" data-index="${qIndex}" value="${mark}" style="width:100px; padding:5px;">
                    </div>
                `;
                answersList.appendChild(block);
                
                setTimeout(() => {
                    editorInstances.push(createReadOnlyEditor(editorId, answerText));
                }, 50);
            });
            
            content.querySelector('#detailSaveMarksBtn').addEventListener('click', async () => {
                const newMarks = [];
                content.querySelectorAll('.detail-mark-input').forEach(input => {
                    const i = parseInt(input.getAttribute('data-index'), 10);
                    newMarks[i] = input.value !== '' ? Number(input.value) : null;
                });
                
                try {
                    console.log(`[Review] Saving marks for ${sub.studentName}:`, newMarks);
                    await saveMarks(examId, sub.studentName, newMarks);
                    const resDiv = content.querySelector('#detailSaveResult');
                    resDiv.style.display = 'block';
                    currentSubmissions[subIdx].marks = newMarks; // Update local state!
                    setTimeout(() => resDiv.style.display = 'none', 3000);
                } catch(err) {
                    alert("Failed to save marks: " + err.message);
                }
            });
        };


        // Bootstrap
        init();
    </script>
</body>
</html>
